<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Boot errors wait here until Sentry loads (src/lib/error-reporting.ts). Allowed by its hash in
         the CSP (worker/security-headers.ts BOOT_SCRIPT_SHA256); change both together. -->
    <script>((w) => { const q = []; w.__sfBootErrors = q; const k = (e) => { if (q.length < 20) q.push(e); }; const o = (e) => k(e.error || new Error(String(e.message))); const r = (e) => k(e.reason); w.addEventListener("error", o); w.addEventListener("unhandledrejection", r); w.__sfBootErrorsOff = () => { w.removeEventListener("error", o); w.removeEventListener("unhandledrejection", r); }; })(window);</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>%APP_NAME%</title>
    <!-- Share tags. The Worker rewrites them per booth on /b/:slug (worker/share.ts). -->
    <meta name="description" content="%APP_TAGLINE%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%APP_NAME%" />
    <meta property="og:title" content="%APP_NAME%" />
    <meta property="og:description" content="%APP_TAGLINE%" />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-placeholder.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%APP_NAME%" />
    <meta name="twitter:description" content="%APP_TAGLINE%" />
    <meta name="twitter:image" content="/og-placeholder.png" />
  </head>
  <body>
    <!-- Painted before any JS arrives (prompt 14): the loading screen's brand block, laid out
         exactly like ui/LoadingScreen.tsx so React's first render replaces it without a shift. The
         progress block is there but invisible, so other pages only flash the brand. -->
    <div id="root">
      <main class="relative h-dvh w-full overflow-hidden bg-ink font-sans text-paper" aria-busy="true">
        <section class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-ink/95 px-4 text-center">
          <h1 class="h-12 font-display font-extrabold text-5xl text-accent leading-none tracking-tight sm:h-15 sm:text-6xl">%APP_NAME%</h1>
          <p class="mt-3 min-h-12 max-w-md text-muted">%APP_TAGLINE%</p>
          <div class="invisible mt-10 w-full max-w-sm" aria-hidden="true">
            <div class="h-2 rounded-full bg-ink-3"></div>
            <p class="mt-2 text-sm">&nbsp;</p>
            <button type="button" disabled class="mt-8 rounded-xl px-10 py-3 font-bold text-lg">Enter</button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

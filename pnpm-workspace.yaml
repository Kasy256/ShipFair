packages:
  - apps/*
  - packages/*
  - e2e
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261025.1"
  - hono@4.13.14

# Packages allowed to run install scripts (both fetch a native binary).
allowBuilds:
  esbuild: true
  workerd: true
  # Optional native msgpack accelerator for Node only; browsers and Workers use the JS path.
  msgpackr-extract: false

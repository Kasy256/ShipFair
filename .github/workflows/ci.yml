name: CI

on:
  pull_request:
    branches: [Development, main]
  push:
    branches: [Development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # art/export GLBs live in Git LFS; without them assets:build only checks placeholders.
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Validation, naming contract and budgets (art/contract.json). Writes nothing.
      - name: Assets check
        run: pnpm assets:build --check --ci

      # The e2e run needs the built assets in apps/web/public (gitignored).
      - name: Assets build
        run: pnpm assets:build --ci

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @shipfair/e2e exec playwright install --with-deps chromium

      - name: Start dev servers
        run: |
          pnpm dev > dev.log 2>&1 &
          for url in http://localhost:5173/api/health http://localhost:1999/health; do
            if ! timeout 180 bash -c "until curl -sf $url > /dev/null; do sleep 2; done"; then
              echo "$url never came up"; cat dev.log; exit 1
            fi
            echo "$url is up"
          done
          # Prove the service bindings both ways before running the browser tests.
          curl -sf http://localhost:5173/api/dev/ping-realtime
          curl -sf http://localhost:1999/dev/ping-web

      - name: E2E
        run: pnpm e2e

      # Pass or fail, so visual changes can be reviewed from the run (prompt 05 screenshots).
      - name: Upload city screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-screenshots
          path: e2e/artifacts/city-*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts
            dev.log
          retention-days: 7

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only Postgres, Auth and the REST API; the rest isn't used by these checks.
      - name: Start Supabase
        run: pnpm db:start -x studio,mailpit,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Reset (migrations from zero + seed)
        run: pnpm db:reset

      - name: Policy tests (pgTAP)
        run: pnpm db:test

      - name: Lint and RLS check
        run: pnpm db:lint

      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code packages/shared/src/db.types.ts

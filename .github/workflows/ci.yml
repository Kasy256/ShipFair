name: CI

on:
  pull_request:
    branches: [Development, main]
  push:
    branches: [Development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @shipfair/e2e exec playwright install --with-deps chromium

      - name: Start dev servers
        run: |
          pnpm dev > dev.log 2>&1 &
          for url in http://localhost:5173/api/health http://localhost:1999/health; do
            if ! timeout 180 bash -c "until curl -sf $url > /dev/null; do sleep 2; done"; then
              echo "$url never came up"; cat dev.log; exit 1
            fi
            echo "$url is up"
          done
          # Prove the service bindings both ways before running the browser tests.
          curl -sf http://localhost:5173/api/dev/ping-realtime
          curl -sf http://localhost:1999/dev/ping-web

      - name: E2E
        run: pnpm e2e

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts
            dev.log
          retention-days: 7

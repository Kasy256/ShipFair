name: CI

on:
  pull_request:
    branches: [Development, main]
  push:
    branches: [Development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # art/export GLBs live in Git LFS; without them assets:build only checks placeholders.
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Prompt 15: advisories are a warning, not a gate (a fix may need an upgrade PR).
      - name: Dependency audit
        continue-on-error: true
        run: |
          if ! pnpm audit --prod --audit-level moderate; then
            echo "::warning title=pnpm audit::Advisories found in production dependencies; see the log"
          fi

      # Every e2e test is @full; @smoke marks the ones run against staging (scripts/e2e-report.ts).
      - name: E2E tags
        run: |
          pnpm --filter @shipfair/e2e exec playwright test --list --reporter=json > e2e-list.json
          node e2e/scripts/e2e-report.ts tags e2e-list.json

      # toktx turns non-palette textures into KTX2 (tools/assets). Pinned and checksum-checked;
      # the asset tests encode with it when it is present.
      - name: Install KTX-Software
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ktx.deb" https://github.com/KhronosGroup/KTX-Software/releases/download/v4.3.2/KTX-Software-4.3.2-Linux-x86_64.deb
          echo "225dfc55c37659c0cfee764ca725eb8941605f07  $RUNNER_TEMP/ktx.deb" | sha1sum -c -
          sudo apt-get install -y "$RUNNER_TEMP/ktx.deb"
          sudo ldconfig
          toktx --version

      - name: Test
        run: pnpm test

      # Validation, naming contract and budgets (art/contract.json). Writes nothing.
      - name: Assets check
        run: pnpm assets:build --check --ci

      # The e2e run needs the built assets in apps/web/public (gitignored).
      - name: Assets build
        run: pnpm assets:build --ci

      - name: Build
        run: pnpm build

      # First-load JS for a world route against e2e/perf-budgets.json (prompt 14).
      - name: Bundle budget
        run: node tools/bundle-budget.ts

      - name: Install Playwright Chromium
        run: pnpm --filter @shipfair/e2e exec playwright install --with-deps chromium

      # /api/world reads the seeded city from local Supabase (prompt 06). Only Postgres, Auth and
      # the REST API; db:start also writes the anon key into apps/web/.dev.vars.
      - name: Start Supabase
        run: pnpm db:start -x studio,mailpit,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Start dev servers
        run: |
          pnpm dev > dev.log 2>&1 &
          for url in http://localhost:5173/api/health http://localhost:1999/health; do
            if ! timeout 180 bash -c "until curl -sf $url > /dev/null; do sleep 2; done"; then
              echo "$url never came up"; cat dev.log; exit 1
            fi
            echo "$url is up"
          done
          # Prove the service bindings both ways before running the browser tests.
          curl -sf http://localhost:5173/api/dev/ping-realtime
          curl -sf http://localhost:1999/dev/ping-web

      # The perf project (render budgets) runs in its own job below.
      # The whole suite (@full). Retries = 1 in CI only; a test that needed it is reported as
      # flaky in the job summary and as a warning annotation.
      - name: E2E
        run: pnpm --filter @shipfair/e2e exec playwright test --project=chromium --project=mobile

      - name: E2E report
        if: always()
        run: node e2e/scripts/e2e-report.ts summary e2e/reports/results.json "E2E @full" || true

      # The production build boots, with Rapier's .wasm taken out of its compat build (dev and the
      # e2e above keep the inline copy). Times it on Fast 4G with 4x CPU; the numbers are in the log.
      - name: Production load (Fast 4G)
        run: E2E_PERF=1 pnpm --filter @shipfair/e2e exec playwright test tests/perf/load.spec.ts --project=chromium -g "fast 4G"

      # Pass or fail, so visual changes can be reviewed from the run (prompt 05 screenshots).
      - name: Upload city screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-screenshots
          path: e2e/artifacts/city-*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts
            e2e/reports
            dev.log
          retention-days: 7

  # Prompt 14: render budgets (e2e/perf-budgets.json) on the scripted route with 500 booths and
  # 60 fake remote players, SwiftShader at 1280×720. Counts only: SwiftShader fps means nothing.
  # Needs the built assets and the dev servers, not Supabase (fake world, solo test mode).
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Assets build
        run: pnpm assets:build --ci

      - name: Install Playwright Chromium
        run: pnpm --filter @shipfair/e2e exec playwright install --with-deps chromium

      - name: Start dev servers
        run: |
          pnpm dev > dev.log 2>&1 &
          if ! timeout 180 bash -c "until curl -sf http://localhost:5173/ > /dev/null; do sleep 2; done"; then
            echo "the web dev server never came up"; cat dev.log; exit 1
          fi

      - name: Render budgets
        run: pnpm --filter @shipfair/e2e exec playwright test --project=perf

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            e2e/artifacts/**/perf-*.json
            dev.log
          if-no-files-found: ignore
          retention-days: 30

  # Prompt 15: secrets scan over the full history of the branch.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Prompt 15: a preview version of the web Worker (staging bindings) per PR, URL in a comment.
  # Skipped for forks and until the staging secrets exist.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: staging
      VITE_RELEASE: ${{ github.event.pull_request.head.sha }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      VITE_REALTIME_HOST: ${{ vars.REALTIME_HOST }}
      VITE_MEDIA_HOST: ${{ vars.MEDIA_HOST }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - name: Staging credentials present
        id: creds
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          lfs: true

      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Build and upload a preview version
        if: steps.creds.outputs.ok == 'true'
        id: upload
        run: |
          pnpm install --frozen-lockfile
          pnpm assets:build --ci
          pnpm --filter @shipfair/web exec vite build --mode staging
          cd apps/web
          pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --var "RELEASE:$VITE_RELEASE" --var "SUPABASE_URL:$VITE_SUPABASE_URL" \
            --var "SUPABASE_ANON_KEY:$VITE_SUPABASE_ANON_KEY" | tee upload.log
          url=$(grep -Eo 'https://pr-[0-9]+-[a-z0-9.-]+\.workers\.dev' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        if: steps.upload.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = '<!-- shipfair-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `Preview of this PR (${sha}, staging data): ${process.env.PREVIEW_URL}`,
              '',
              "It uses staging's database, so a PR with a new migration may not work here until it is merged.",
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only Postgres, Auth and the REST API; the rest isn't used by these checks.
      - name: Start Supabase
        run: pnpm db:start -x studio,mailpit,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Reset (migrations from zero + seed)
        run: pnpm db:reset

      - name: Policy tests (pgTAP)
        run: pnpm db:test

      - name: Lint and RLS check
        run: pnpm db:lint

      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code packages/shared/src/db.types.ts

      # has_profanity (SQL) and its pgTAP test are generated from the client's blocklist.
      - name: Name filter is in sync with the blocklist
        run: pnpm db:sync-blocklist --check
